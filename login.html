<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Exchange Rate Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">
                <h1>Exchange Rate Generator</h1>
                <p>Sign in to access the exchange-rate dashboard.</p>
            </div>

            <!-- LOGIN -->
            <form id="loginForm">

                <h2>Sign In</h2>

                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="divider">
                <span>New user?</span>
            </div>

            <!-- REGISTER -->
            <form id="signupForm">

                <h2>Create Account</h2>

                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>

        </section>

    </main>

    <!-- Supabase JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our authentication code -->
    <script src="auth.js"></script>

</body>
</html>
